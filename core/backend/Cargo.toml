# The Rust back end (docs/rust-backend-plan.md): the work of the Python back end moved here wave by wave,
# behind one command table, so the app shell (Tauri: fae-app) stays thin.
# Its own workspace, like the GPU core's: the CPU core's Cargo.lock and pinned WASM build stay untouched.
#   fae-backend     : the library (every command; no Python in it)
#   fae-backend-py  : Python extension `fae_backend` (the tests: tests/fastedit/backend.py)
#   fae-app         : the app, Fae.exe: the Tauri shell (B7; build.bat). Not a default member: `cargo test` and the
#                     Python extension's build don't need Tauri (cargo build -p fae-app does).
[workspace]
resolver = "2"
members = ["fae-backend", "fae-backend-py", "fae-app"]
default-members = ["fae-backend", "fae-backend-py"]

[workspace.package]
version = "0.7.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# rav1e 0.8.1 with fae's patch (github.com/Nukvah/rav1e-fae, FAE-PATCH.md there): its frame-wide loop
# filter steps run in parallel, same output. Pinned to a commit; to update, change rev.
[patch.crates-io]
rav1e = { git = "https://github.com/Nukvah/rav1e-fae", rev = "5b9ef70dec6bd5e2273e5ea886b5ebd70d140a7f" }
