[package]
name = "fae-backend-py"
version.workspace = true
edition.workspace = true

[lib]
name = "fae_backend"
crate-type = ["cdylib"]

[dependencies]
backend = { package = "fae-backend", path = "../fae-backend" }
pyo3 = { version = "0.30", features = ["extension-module"] }
serde_json = "1"

[features]
# libjpeg-turbo's SIMD code (needs nasm to build); build_backend.bat turns it on when nasm is found
jpeg-simd = ["backend/jpeg-simd"]
