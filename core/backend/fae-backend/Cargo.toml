[package]
name = "fae-backend"
version.workspace = true
edition.workspace = true

[features]
# libjpeg-turbo's SIMD code (needs nasm when building; same pixels, ~40 % faster on big JPEGs).
# build_backend.bat turns it on when nasm is installed.
jpeg-simd = ["mozjpeg/nasm_simd"]
# libjpeg-turbo's SIMD + rav1e's assembly (needs nasm; AVIF through rav1e several times faster, same idea of
# output). rav1d stays without its assembly: it doesn't link into the Python extension (not position-independent).
simd = ["jpeg-simd", "rav1e/asm"]

[dependencies]
# preserve_order: settings / presets keep their key order when written back; float_roundtrip: numbers parsed
# exactly as Python wrote them (the default parser can be one unit in the last place off: edit tables)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# decoders (decode.rs): libjpeg-turbo's decoder (as Pillow), built with the C compiler alone
mozjpeg = { version = "0.10", default-features = false }
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
png = "0.18"
gif = "0.14"
image-webp = "0.2"
image = { version = "0.25", default-features = false, features = ["tiff", "bmp", "tga", "pnm", "ico"] }
tiff = "0.11"
jxl-oxide = "0.12"
kamadak-exif = "0.6"
# geometry / resampling (B2): rows in parallel
rayon = "1"
# HEIC: libheif loaded at run time (heif.rs)
libloading = "0.9"
# encoders (B4, encode.rs): libwebp 1.6 (the version Pillow's wheels ship: the same WebP bytes), built by cc;
# zlib-rs for PNG (zlib-ng's algorithms, as Pillow's wheels; pure Rust)
libwebp-sys = "0.14.4"
libz-rs-sys = "0.6"
# AVIF (B4): rav1e encodes what SvtAv1EncApp doesn't (alpha, the "aom" choice), rav1d (dav1d in Rust) decodes;
# both pure Rust; rav1e's assembly with the simd feature
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# the edit (B5, render.rs): the CPU core and the GPU core of core/ linked as crates (their own workspaces
# keep their Cargo.locks; the CPU core's WASM build is untouched); pollster waits for the GPU device
fe = { package = "fastedit-core", path = "../../fastedit-core", features = ["parallel"] }
gpu = { package = "fae-gpu", path = "../../gpu/fae-gpu" }
pollster = "0.4"
