<!doctype html>

<style>
  body { background: #0e0f11; color: #d8d8d8; font: 14px/1.5 system-ui, sans-serif; margin: 32px; }

  p.sub { color: #8a8a8a; margin: 0 0 20px; }

  td { padding: 6px 14px 6px 0; vertical-align: top; border-bottom: 1px solid #22252a; }

  textarea { width: 100%; max-width: 900px; height: 220px; margin-top: 20px; background: #16181c; color: #cfcfcf;
             border: 1px solid #2a2d33; font: 12px/1.4 ui-monospace, Consolas, monospace; }

<body>
<h1>GPU core: feasibility spike (G0)</h1>
<p class="sub">WebGPU in this window, the WebAssembly build of the GPU core (Curves) and its speed.
  Start with <code>Fae.exe --gpu-spike</code> (or <code>fae.py --gpu-spike</code>). Takes about a minute; the big sizes need ~1.5 GB of GPU memory.</p>
