<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fae</title>
<!-- The splash window (Fae.exe, main.rs) while the main window loads: this release's picture, the logo,
     the version and the progress startup.js sends (window.splashProgress), over the app's water caustics
     (caustics.js: on #splash, the panel).
     Each release: replace splash.jpg (any size; it is cropped to a square, its centre-right kept). An
     optional splash.json, {"credit": "Artwork: Mirelle"}, adds a credit line under the bar. -->
<style>
@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block;
  src: url(fonts/inter-latin.woff2) format("woff2"); }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1c1f; color: #fff;
  font: 13px/18px Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
main { display: flex; height: 100%; }
.art { width: 400px; height: 100%; flex: none; object-fit: cover; object-position: 70% 50%; background: #161618; }
.art.missing { display: none; }
.panel { position: relative; flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 26px 26px; display: flex;
  flex-direction: column; gap: 6px; background: #1c1c1f; }
.panel > :not(canvas) { position: relative; }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 1s ease-in; }
canvas.fx.on { opacity: 1; }
.logo { width: 56px; height: 56px; }
h1 { margin: 14px 0 0; font-size: 30px; line-height: 34px; font-weight: 700; }
.muted { margin: 0; color: #b8b8be; }
.foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
#line { margin: 0; font-size: 12px; color: #d0d0d5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .16); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 2px; transition: width .15s;
  background: linear-gradient(90deg, #FFB3C7, #C9B8FF, #A8E8DC); }
#credit { margin: 6px 0 0; font-size: 11px; color: #9a9aa0; }
#credit:empty { display: none; }
</style>
</head>
<body>
<main>
  <img class="art" src="splash.jpg" alt="" onerror="this.classList.add('missing')">
  <div class="panel" id="splash">
    <img class="logo" src="logo.svg" alt="Fae">
    <h1>Fae</h1>
    <p class="muted">Fast Image Editor</p>
    <p class="muted" id="version"></p>
    <div class="foot">
      <p id="line">Starting…</p>
      <div class="bar"><i id="bar"></i></div>
      <p id="credit"></p>
    </div>
  </div>
</main>
<script src="js/caustics.js"></script>
<script>
'use strict';
const v = new URLSearchParams(location.search).get('v');
if (v) document.getElementById('version').textContent = 'Version ' + v;
window.splashProgress = (frac, line) => {
  document.getElementById('bar').style.width = (100 * Math.max(0, Math.min(1, frac))).toFixed(1) + '%';
  if (line) document.getElementById('line').textContent = line;
};
fetch('splash.json').then(r => r.ok ? r.json() : null).then(j => {
  if (j && j.credit) document.getElementById('credit').textContent = j.credit;
}).catch(() => {});
</script>
</body>
</html>
